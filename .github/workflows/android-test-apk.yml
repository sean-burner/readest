# Builds an installable Android APK of this fork for testing on a phone.
#
# Run it from the Actions tab (Android test APK > Run workflow), or it runs on
# every push to main. Download the "readest-android-apk" artifact from the run,
# unzip it on the phone and open the .apk to install.
#
# The app installs as "com.seanburner.readest.dev", so it sits next to the
# official Readest app instead of replacing it. It is signed with the keystore
# in the ANDROID_TEST_KEYSTORE_BASE64 secret when set (password in
# ANDROID_TEST_KEYSTORE_PASSWORD, alias "readest"). Without that secret each
# run signs with a new throwaway key, and Android then asks you to uninstall
# the previous build before installing a new one.
name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/readest-app/**'
      - 'packages/**'
      - '.github/workflows/android-test-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: android-test-apk-cargo

      - name: create .env.local file for Next.js
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > apps/readest-app/.env.local

      - name: build and sign Android apk
        shell: bash
        timeout-minutes: 100
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/readest-app/
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

          # Install next to the official app instead of over it.
          sed -i 's/applicationId = "com.bilingify.readest"/applicationId = "com.seanburner.readest.dev"/' \
            src-tauri/gen/android/app/build.gradle.kts
          grep -q 'applicationId = "com.seanburner.readest.dev"' src-tauri/gen/android/app/build.gradle.kts

          keystore="$RUNNER_TEMP/keystore.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            base64 -d <<< "$KEYSTORE_BASE64" > "$keystore"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::notice::No ANDROID_TEST_KEYSTORE_BASE64 secret; signing with a throwaway key."
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore "$keystore" -alias readest -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass "$password" -keypass "$password" \
              -dname "CN=Readest test build"
          fi
          {
            echo "keyAlias=readest"
            echo "password=$password"
            echo "storeFile=$keystore"
          } > src-tauri/gen/android/keystore.properties

          pnpm tauri android build -t aarch64 --apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "$GITHUB_WORKSPACE/out/Readest-dev-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readest-android-apk
          path: out/*.apk
          retention-days: 30
